<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>みんなの野菜畑</title>
  <meta name="description" content="学校で育てている野菜のページ一覧です。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <svg class="vine vine--left" viewBox="0 0 120 200" aria-hidden="true">
      <path d="M10 0 C 60 40, -10 80, 50 120 S 30 180, 70 200" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M38 52 c 20 -18 42 -8 46 4 c -18 12 -38 10 -46 -4z" fill="currentColor"/>
      <path d="M44 128 c -22 -14 -40 -2 -42 10 c 20 10 36 4 42 -10z" fill="currentColor"/>
    </svg>
    <svg class="vine vine--right" viewBox="0 0 120 200" aria-hidden="true">
      <path d="M110 0 C 60 40, 130 80, 70 120 S 90 180, 50 200" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M82 52 c -20 -18 -42 -8 -46 4 c 18 12 38 10 46 -4z" fill="currentColor"/>
      <path d="M76 128 c 22 -14 40 -2 42 10 c -20 10 -36 4 -42 -10z" fill="currentColor"/>
    </svg>
    <div class="site-header__inner">
      <p class="site-header__eyebrow">学校の畑から</p>
      <h1 class="site-header__title">みんなの野菜畑</h1>
      <p class="site-header__lead">育てている野菜をえらんで、それぞれのページを見てみよう。</p>
    </div>
  </header>

  <main class="container">
    <p class="status" id="status" role="status">読み込み中…</p>
    <ul class="vege-grid" id="vege-grid"></ul>
  </main>

  <footer class="site-footer">
    <p>野菜の追加は <code>vegetables.json</code> に1項目書き足すだけでOKです。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
